name: CLIPRA actual offline Whisper inference
on:
  push:
    branches:
      - feature/clipra-v6-real-qa-previews
      - main
  pull_request:
    paths:
      - 'backend/clipra/local_speech.py'
      - 'backend/requirements.txt'
      - 'scripts/qa_real_whisper.py'
      - '.github/workflows/whisper-qa.yml'
permissions:
  contents: read
jobs:
  real-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free audio tools and offline model dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install 'faster-whisper>=1.1,<2'
      - name: Download genuine tiny model and transcribe actual voiced MP4
        run: PYTHONPATH=backend python scripts/qa_real_whisper.py
